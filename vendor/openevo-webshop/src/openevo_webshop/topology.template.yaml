# TopologyConfig template for the WebShop benchmark (Linux path).
#
# STATUS: BLOCKED this round. This file is code-only — it is NOT executed,
# because there is no Linux Docker/Apptainer host available (Colab has no
# Docker daemon). It documents the shape of the topology the Linux end-to-end
# run will load via TopologyConfig.load().
#
# Schema verified against OpenEvo/src/openevo/config/topology.py:
#   TopologyConfig{ rollout: RolloutServiceConfig, gateway: GatewayConfig }
#   GatewayConfig{ nodes: [GatewayNodeConfig, ...] (min 1) }
#   extra="forbid" everywhere — do NOT add keys not in the schema.

rollout:
  host: 0.0.0.0
  port: 8100
  # public_url is auto-derived from host+port when omitted; set explicitly for
  # a remote Linux host, e.g.:
  # public_url: http://<linux-host>:8100

gateway:
  nodes:
    - id: webshop-node-0
      host: 0.0.0.0
      port: 8081
      public_url: http://<linux-host>:8081
      model_served: Qwen/Qwen2.5-3B-Instruct
      inference:
        engine: sglang
        base_url: http://127.0.0.1:8000
      max_init_workers: 4
      max_run_workers: 2
      max_postrun_workers: 4
      # default_runtime carries the WebShop container image; see submit.py for
      # how the TaskRequest runtime overrides / specializes this.
