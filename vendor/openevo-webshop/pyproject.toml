[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openevo-webshop"
version = "0.1.0"
description = "WebShop adapter for running WebShop (Gym) through OpenEvo Core."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "openevo==0.1.10",
]

[project.scripts]
openevo-webshop = "openevo_webshop.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["openevo_webshop*"]

[tool.setuptools.package-data]
openevo_webshop = ["data/gates/*.json"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
testpaths = ["tests"]
